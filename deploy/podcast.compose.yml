# Included as an override of stroom/docker-compose.yml by the root stack.
# GPU models require provisioning with deploy/voicestudio/install-model.py.
services:
  stroom-api:
    environment:
      PODCAST_VOICESTUDIO_URL: http://stroom-voice:3900
      PODCAST_VOICESTUDIO_KEY: ${STROOM_VOICESTUDIO_KEY:?Set a private VoiceStudio API key}
      PODCAST_HOST_STATS_URL: https://strongbad.nl/stats.json
      PODCAST_MEDIA_DIR: /data/podcast-tests
      PODCAST_ENABLED_MODELS: ${PODCAST_ENABLED_MODELS:-kittentts,omnivoice,cosyvoice}

  stroom-voice:
    image: stroom-voice:0.5.6-gpu4
    build:
      context: ../stroom-src/deploy/voicestudio
    container_name: stroom-voice
    # unless-stopped: on-failure left it down after a clean shutdown on
    # 2026-10-25 (exit 0 is never restarted). mem_limit/memswap_limit keep a
    # crash loop from exhausting guest memory.
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.0
    pids_limit: 512
    devices:
      - nvidia.com/gpu=0
    security_opt:
      - no-new-privileges:true
    environment:
      OMNIVOICE_API_KEY: ${STROOM_VOICESTUDIO_KEY:?Set a private VoiceStudio API key}
      OMNIVOICE_SERVER_MODE: "1"
      OMNIVOICE_DATA_DIR: /app/omnivoice_data
      # Upstream resolves the explicit "omnivoice" ID through the active backend.
      # Kitten and CosyVoice select their own engines explicitly per request.
      OMNIVOICE_TTS_BACKEND: omnivoice
      OMNIVOICE_SINGLE_ENGINE_RESIDENT: "1"
      OMNIVOICE_ENGINE_IDLE_UNLOAD_SECONDS: "30"
      OMNIVOICE_IDLE_TIMEOUT_S: "30"
      STROOM_TTS_LAZY_START: "1"
      TORCH_COMPILE_DISABLE: "1"
      TORCHDYNAMO_DISABLE: "1"
      OMNIVOICE_PRELOAD_TTS_ASR: "0"
      OMNIVOICE_DOWNLOAD_MAX_WORKERS: "1"
      OMNIVOICE_PRELOAD_CAPTURE_ASR: "0"
      OMNIVOICE_PRELOAD_WATERMARK: "0"
      OMNIVOICE_ANALYTICS_DISABLED: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - stroom-voice-data:/app/omnivoice_data
    networks:
      - stroom-backend
      - personal_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  stroom-voice-data:
