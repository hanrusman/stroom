# Compatibility overlay: A2 is now already included in podcast.compose.yml.
# New installations do not need to include this file separately.
# Verify nvidia.com/gpu=0 resolves to the A2 before use. Never expose all GPUs.
# This does not enable any additional model in Stroom or increase memory limits.
services:
  stroom-voice:
    devices:
      - "nvidia.com/gpu=0"
