name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    env:
      # Dummy-config zodat Settings (fail-fast) valideert; unit-tests raken
      # geen echte database of LLM.
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      ASYNC_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
      LITELLM_MASTER_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: api/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q -m "not integration"
      - run: pip install ruff && ruff check .
      # Eerst signaal opbouwen; hard maken zodra de bestaande findings weg zijn.
      - run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
