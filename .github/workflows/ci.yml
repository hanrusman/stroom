name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Wegwerp-Postgres voor de `db`-tests (die werken in schema stroom_test).
      postgres:
        image: pgvector/pgvector:pg16  # gelijk aan stroom-db
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # core.config.Settings eist deze bij import; unit-tests raken geen DB of
      # LiteLLM. Integratietests (-m integration) draaien alleen in de live
      # stroom-api container, zie api/tests/README.md.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ASYNC_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      LITELLM_MASTER_KEY: ci-dummy
      STROOM_TEST_DB_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # gelijk aan api/Dockerfile
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.16.10
      - run: ruff check .
      - run: pytest -m "unit or db"

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
