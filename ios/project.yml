name: Stroom
options:
  bundleIdPrefix: nl.c4w
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Stroom:
    type: application
    platform: iOS
    sources: [Stroom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.c4w.stroom.ios
        INFOPLIST_FILE: Stroom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [StroomTests, StroomUITests]
  StroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StroomTests]
    dependencies:
      - target: Stroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  StroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StroomUITests]
    dependencies:
      - target: Stroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
